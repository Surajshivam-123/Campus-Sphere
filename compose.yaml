services:
  backend:
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb+srv://skumar919810_db_user:Csph919810@campus-sphere.1vcerdd.mongodb.net/?appName=Campus-Sphere
      REDIS_URL: redis://redis:6379
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost
      FRONTEND_ORIGIN_WITH_PATH: http://localhost
      GOOGLE_CALLBACK_URL: http://localhost/api/cpsh/users/auth/google/callback
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/client
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Monitoring stack ────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # mongodb-exporter does not support Atlas (mongodb+srv://) URIs.
  # Use MongoDB Atlas built-in monitoring at https://cloud.mongodb.com instead.
  # If you switch back to a self-hosted MongoDB, restore this service and
  # change MONGODB_URI back to mongodb://mongo:27017
  # mongodb-exporter:
  #   image: percona/mongodb_exporter:0.44
  #   ...

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # node-exporter is only useful on Linux hosts.
  # On Windows (Docker Desktop), use windows_exporter natively instead.
  # To start with node-exporter: docker compose --profile linux up
  node-exporter:
    image: prom/node-exporter:latest
    profiles: ["linux"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
